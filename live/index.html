<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Make It Back Live</title>
<meta name="description" content="Make it TV presents The Make It Back Report, live: tonight's money, the bets, the polls, the rich list and the receipt.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* MAKE IT BACK LIVE: the second screen. A read-only phone page viewers keep open next to the stream.
     Served by the helper at /live (it reads /live/state); on a public host it reads the "live" row in Supabase. */
  :root { --ink: #0A0A0A; --ink2: #141413; --ink3: #1c1c1a; --paper: #F4F3EE; --red: #FF4429; --dim: #8C8B85; --dim2: #5d5c57; --rule: #2a2a28; --gold: #F2B63D;
          --display: "Anton", Impact, "Arial Narrow Bold", sans-serif; --ui: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
          --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --spring: cubic-bezier(.22,1,.36,1); color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 600 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; padding-block: max(18px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap > * { min-width: 0; }

  /* motion */
  .rise { animation: rise .7s var(--spring) both; animation-delay: var(--d, 0ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); filter: blur(6px); } }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.82); } }
  @keyframes bounce { 0% { opacity: 0; transform: translateY(-.55em) scale(.92, 1.16) rotate(var(--r, -4deg)); } 18% { opacity: 1; }
                      38% { transform: translateY(0) scale(1.14, .84) rotate(var(--r, -4deg)); } 58% { transform: translateY(-.1em) scale(.97, 1.05) rotate(var(--r, -4deg)); }
                      76% { transform: scale(1.03, .97) rotate(var(--r, -4deg)); } 100% { opacity: 1; transform: rotate(var(--r, -4deg)); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }

  /* masthead */
  .mast { padding-top: 4px; }
  .kick { font: 800 11px/1.2 var(--ui); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  /* Make it TV presents: the network logo beside the show name */
  .net { display: flex; align-items: center; gap: 14px; min-width: 0; margin-bottom: 8px; }
  .net img { flex: none; width: 88px; height: auto; aspect-ratio: 1079 / 900; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
  .net .kick b { display: block; color: var(--paper); font-weight: 900; margin-top: 4px; }
  .mrow1 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .mast h1 { margin: 0; display: flex; align-items: center; gap: 12px; font: 400 clamp(46px, 16vw, 88px)/.9 var(--display); text-transform: uppercase; letter-spacing: -.005em; min-width: 0; text-wrap: balance; }
  .mast h1 .dot { flex: none; width: .2em; height: .2em; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 .07em rgba(255,68,41,.22); animation: breathe 1.8s ease-in-out infinite; display: none; }
  .mast[data-air="live"] h1 .dot { display: block; }
  .mast[data-air="off"] h1, .mast[data-air="wait"] h1 { color: var(--dim); }
  .tw { flex: none; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--paper); color: var(--ink); font: 900 12px/1 var(--ui); letter-spacing: .16em;
        text-transform: uppercase; padding: 12px 14px 11px; margin-bottom: 4px; transition: transform .12s ease, background-color .2s ease; }
  .tw::before { content: ""; width: 0; height: 0; border-left: 9px solid var(--red); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .tw:active { transform: translateY(1px); }
  .meta { margin-top: 10px; font: 800 12px/1.35 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .meta b { color: var(--paper); font-weight: 900; }

  /* off air */
  .banner { background: var(--ink2); border-left: 6px solid var(--red); padding: 14px 16px 15px; }
  .banner .bt { font: 400 26px/1 var(--display); text-transform: uppercase; }
  .banner a { display: inline-block; margin-top: 8px; font: 900 13px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--red); text-decoration: none; }
  .banner .bs { margin-top: 8px; color: var(--dim); font-size: 13px; font-weight: 700; }
  body[data-air="off"] .live-only { display: none !important; }
  body[data-air="off"] .dimmable { opacity: .42; filter: grayscale(1); transition: opacity .6s ease, filter .6s ease; }

  /* cards */
  .card { position: relative; overflow: hidden; background: var(--ink2); box-shadow: inset 0 0 0 1px rgba(244,243,238,.08); }
  .band { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--red); color: #fff; font: 900 12px/1 var(--ui);
          letter-spacing: .2em; text-transform: uppercase; padding: 11px 14px 10px; white-space: nowrap; }
  .band .l { display: flex; align-items: center; gap: 9px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .band .l::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: breathe 1.6s ease-in-out infinite; }
  .band .r { font: 700 15px/1 var(--mono); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .band.paper { background: var(--paper); color: var(--ink); } .band.paper .l::before { background: var(--red); }
  .band.quiet { background: var(--ink3); color: var(--paper); } .band.quiet .l::before { background: var(--red); }
  .body { padding: 14px 16px 16px; }
  .q { font: 400 34px/.95 var(--display); text-transform: uppercase; letter-spacing: -.004em; text-wrap: balance; overflow-wrap: anywhere; }
  .sub { margin-top: 4px; color: var(--dim); font: 700 14px/1.35 var(--ui); overflow-wrap: anywhere; }
  .foot { margin-top: 14px; font: 800 11px/1.5 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .foot b { color: var(--paper); font-weight: 900; letter-spacing: .06em; }
  .bar { position: relative; height: 12px; background: rgba(244,243,238,.1); overflow: hidden; }
  .bar i { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: var(--paper); transition: transform .9s var(--spring), background-color .4s ease; }

  /* made back */
  .made .big { display: flex; align-items: baseline; margin-top: 6px; font: 400 clamp(72px, 26vw, 120px)/.9 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .made .big .cur { color: var(--red); font-size: .7em; margin-right: .04em; }
  .made .big.neg .cur { color: var(--dim); }
  .made .gbar { height: 14px; margin-top: 12px; } .made .gbar i { background: var(--red); }
  .made.goal .gbar i { background: var(--gold); }
  .made .mr { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font: 800 12px/1.2 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .made .mr b { color: var(--paper); }
  .made .gchip { display: none; position: absolute; top: 16px; right: 16px; background: var(--gold); color: var(--ink); font: 400 26px/1 var(--display); padding: 6px 10px 2px; --r: -5deg; animation: bounce .8s ease-out both; }
  .made.goal .gchip { display: block; }
  .made .dl { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font: 800 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .made .dl b { color: var(--red); }

  /* live games */
  .now { display: grid; gap: 14px; }
  .now:empty { display: none; }
  .split { display: grid; gap: 8px; margin-top: 14px; }
  .side { display: grid; grid-template-columns: 52px minmax(0, 1fr) 86px; align-items: center; gap: 10px; }
  .side .k { font: 400 28px/1 var(--display); }
  .side .bar { height: 22px; } .side.no .bar i { background: var(--red); }
  .side .v { text-align: right; font: 400 24px/1 var(--display); font-variant-numeric: tabular-nums; }
  .side .v small { display: block; margin-top: 3px; font: 800 10px/1.2 var(--ui); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  .stamp { display: inline-block; margin-top: 12px; padding-left: .04em; white-space: nowrap; font: 400 96px/.86 var(--display); text-transform: uppercase; transform-origin: 50% 100%; animation: bounce .8s ease-out .05s both; }
  .stamp.yes { color: var(--paper); } .stamp.no, .stamp.red { color: var(--red); } .stamp.off { color: var(--dim); font-size: 64px; --r: 0deg; }
  .won { margin-top: 6px; font: 800 16px/1.3 var(--ui); letter-spacing: .04em; }
  .won b { color: var(--red); }
  .prow { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) 58px; align-items: center; gap: 8px; min-height: 44px; margin-top: 8px; background: rgba(244,243,238,.07); }
  .prow > i { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: rgba(244,243,238,.18); transition: transform .9s var(--spring), background-color .4s ease; }
  .prow > span { position: relative; }
  .prow .pk { padding-left: 10px; font: 900 14px/1 var(--ui); color: var(--red); }
  .prow .pl { font: 400 24px/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere; padding: 8px 0; }
  .prow .pv { text-align: right; padding-right: 10px; font: 400 22px/1 var(--display); font-variant-numeric: tabular-nums; }
  .prow.win > i { background: var(--red); } .prow.win .pk { color: #fff; }

  /* the offer */
  .ask { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; padding: 12px 14px 10px; background: var(--ink); box-shadow: inset 0 0 0 1px rgba(244,243,238,.1); }
  .ask .kick { color: var(--dim); }
  .ask .av { font: 400 clamp(44px, 15vw, 64px)/.9 var(--display); text-transform: uppercase; color: var(--paper); overflow-wrap: anywhere; margin-top: 4px; }
  .ask .tm { font: 800 11px/1.3 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); text-align: right; padding-bottom: 4px; }
  .vrows { display: grid; gap: 8px; margin-top: 14px; }
  .vrow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 62px; align-items: center; gap: 10px; }
  .vrow .vk { font: 900 12px/1 var(--ui); letter-spacing: .14em; }
  .vrow .bar { height: 18px; }
  .vrow.counter .bar i { background: var(--red); } .vrow.walk .bar i { background: var(--dim); }
  .vrow .vv { text-align: right; font: 400 22px/1 var(--display); font-variant-numeric: tabular-nums; }
  .vrow .vv small { display: block; margin-top: 2px; font: 800 10px/1 var(--ui); letter-spacing: .1em; color: var(--dim); }
  .vrow.real .vk { color: var(--red); } .vrow.real .bar { box-shadow: 0 0 0 2px var(--red); }
  .chatc { margin-top: 12px; font: 800 13px/1.35 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .chatc b { color: var(--paper); font: 400 22px/1 var(--display); letter-spacing: .01em; margin-left: 4px; }
  .reveal { margin-top: 6px; }
  .reveal .stamp { font-size: clamp(64px, 21vw, 92px); }
  .landed { margin-top: 8px; font: 800 14px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .landed b { display: block; margin-top: 4px; color: var(--paper); font: 400 40px/.95 var(--display); letter-spacing: 0; }
  .note { margin-top: 10px; padding-left: 12px; border-left: 3px solid var(--red); font: 700 15px/1.4 var(--ui); color: var(--paper); overflow-wrap: anywhere; }
  .called { margin-top: 12px; font: 800 12px/1.4 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .called b { color: var(--paper); }
  .deal { margin-top: 12px; display: grid; }
  .drow { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); align-items: start; }
  .drow.hd { border-top: 0; padding: 0 0 6px; font: 900 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .drow .dt { font: 400 20px/1 var(--display); color: var(--paper); text-transform: uppercase; overflow-wrap: anywhere; }
  .drow .dt small, .drow .dc small, .drow .dr small { display: block; margin-top: 3px; font: 700 12px/1.2 var(--ui); color: var(--dim); letter-spacing: 0; text-transform: none; }
  .drow .dc, .drow .dr { font: 900 12px/1.2 var(--ui); letter-spacing: .1em; text-transform: uppercase; overflow-wrap: anywhere; }
  .drow .dr { color: var(--paper); }
  .drow .ok { color: var(--red); } .drow .ok::before { content: "✓ "; } .drow .miss { color: var(--dim); } .drow .miss::before { content: "✗ "; }
  .ending { margin-top: 12px; font: 400 26px/1.02 var(--display); text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
  .score { margin-top: 8px; display: inline-block; background: var(--red); color: #fff; font: 900 12px/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; padding: 8px 10px 7px; }

  /* pinned chat */
  .pin { background: var(--paper); color: var(--ink); padding: 30px 18px 18px 20px; position: relative; overflow: visible; margin-top: 18px; }
  .pin .pq { position: absolute; left: 12px; top: -24px; pointer-events: none; font: 400 104px/1 var(--display); color: var(--red); }
  .pin .pk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pin .pb { background: var(--ink); color: var(--paper); font: 900 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; padding: 6px 8px 5px; }
  .pin .pw { font: 400 26px/1 var(--display); text-transform: uppercase; color: var(--red); overflow-wrap: anywhere; min-width: 0; }
  .pin .pt { margin-top: 8px; font: 800 22px/1.18 var(--ui); letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: pretty; }

  /* exchange */
  .xrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 86px; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
  .xrow:first-child { border-top: 0; padding-top: 2px; }
  .xrow .xt { font: 400 30px/.92 var(--display); min-width: 0; }
  .xrow .xt small { display: block; margin-top: 4px; font: 800 10px/1.25 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); overflow-wrap: anywhere; }
  .xrow svg { width: 96px; height: 36px; display: block; overflow: visible; }
  .xrow .xp { text-align: right; font: 400 28px/1 var(--display); font-variant-numeric: tabular-nums; }
  .xrow .xp small { display: block; margin-top: 4px; font: 900 12px/1 var(--mono); }
  .up { color: var(--paper); } .dn { color: var(--red); }

  /* rich list */
  .rl { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  .rl li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
  .rl li:first-child { border-top: 0; padding-top: 2px; }
  .rl .rk { font: 400 20px/1 var(--display); color: var(--dim); }
  .rl .rn { font: 400 22px/1.05 var(--display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rl .rb { font: 700 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--paper); }
  .rl li.one .rk { color: var(--gold); font-size: 30px; } .rl li.one .rn { font-size: 34px; } .rl li.one .rb { font-size: 17px; color: var(--gold); }
  .rl li.one { grid-template-columns: 38px minmax(0, 1fr); padding-bottom: 12px; row-gap: 6px; }
  .rl li.one .rb { grid-column: 2; }
  .rl li.one .rn { white-space: normal; overflow-wrap: anywhere; }

  /* receipt */
  .rcwrap { padding-bottom: 12px; }
  .rc { position: relative; background: var(--paper); color: var(--ink); padding: 18px 18px 18px; font: 500 13px/1.5 var(--mono); }
  .rc::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
               background: linear-gradient(45deg, transparent 33.33%, var(--paper) 33.33%, var(--paper) 66.66%, transparent 66.66%),
                           linear-gradient(-45deg, transparent 33.33%, var(--paper) 33.33%, var(--paper) 66.66%, transparent 66.66%);
               background-size: 14px 28px; background-position: 0 -14px; }
  .rc .rh { text-align: center; }
  .rc .rh b { display: block; font: 400 24px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .rc .rh span { display: block; margin-top: 4px; font: 700 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #55534d; }
  .rc hr { border: 0; border-top: 1.5px dashed rgba(10,10,10,.45); margin: 12px 0; }
  .rc .li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; }
  .rc .li .n { color: #77756e; } .rc .li .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
  .rc .li .a { font-weight: 700; font-variant-numeric: tabular-nums; } .rc .li.neg .a { color: #c3240f; }
  .rc .li.new { animation: rise .6s var(--spring) both; }
  .rc .more { color: #77756e; text-transform: uppercase; font-size: 11px; letter-spacing: .1em; }
  .rc .tot { display: flex; justify-content: space-between; align-items: baseline; font: 400 30px/1 var(--display); text-transform: uppercase; }
  .rc .tot span:last-child { font-variant-numeric: tabular-nums; }
  .rc .bc { display: block; margin: 14px auto 4px; width: 200px; max-width: 100%; height: 34px; }
  .rc .ty { text-align: center; font: 700 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #55534d; }

  /* after the show */
  .potn { background: var(--red); color: #fff; padding: 16px 16px 18px; position: relative; overflow: hidden; }
  .potn .kick { color: rgba(255,255,255,.85); }
  .potn .pl { margin-top: 8px; font: 400 clamp(56px, 20vw, 96px)/.86 var(--display); text-transform: uppercase; overflow-wrap: anywhere; transform-origin: 50% 100%; --r: -3deg; animation: bounce .8s ease-out .1s both; display: inline-block; }
  .potn .pw { margin-top: 10px; font: 800 13px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); margin-top: 14px; }
  .stats div { background: var(--ink2); padding: 12px 10px 10px; min-width: 0; }
  .stats b { display: block; font: 400 32px/1 var(--display); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats small { display: block; margin-top: 5px; font: 800 10px/1.2 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .stats .wide { grid-column: 1 / -1; }
  .stats .wide b { margin-top: 6px; font-size: 30px; text-transform: uppercase; color: var(--red); white-space: normal; overflow-wrap: anywhere; }

  /* make it back-athon */
  .athon .ahead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .athon .chip { flex: none; background: var(--red); color: #fff; font: 900 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; padding: 6px 8px 5px; }
  .athon .chip.p { background: var(--ink3); color: var(--paper); box-shadow: inset 0 0 0 1px rgba(244,243,238,.2); }
  .athon .chip.t { background: var(--paper); color: var(--ink); }
  .athon .clock { display: flex; align-items: baseline; margin-top: 8px; font: 400 clamp(64px, 22vw, 116px)/.9 var(--display); white-space: nowrap; transition: color .5s ease; }
  .athon .clock .d { display: inline-block; width: .5em; text-align: center; }
  .athon .clock .c { display: inline-block; width: .22em; text-align: center; color: var(--dim); }
  .athon.low .clock { color: var(--red); }
  .athon.paused .clock { color: var(--dim); }
  .athon .stamp.time { margin-top: 6px; color: var(--red); font-size: clamp(72px, 26vw, 120px); }
  .athon .pop { margin-top: 10px; display: inline-flex; align-items: baseline; gap: 10px; max-width: 100%; background: var(--paper); color: var(--ink); padding: 7px 10px 5px;
                font: 800 12px/1.25 var(--ui); letter-spacing: .08em; text-transform: uppercase; transform-origin: 0 100%; transition: opacity .6s ease; }
  .athon .pop b { flex: none; font: 400 24px/1 var(--display); color: var(--red); letter-spacing: 0; }
  .athon .pop span { min-width: 0; overflow-wrap: anywhere; }
  .athon .pop.go { animation: bounce .8s ease-out both; --r: -2deg; }
  .athon .pop.fade { opacity: .35; }
  .athon .am { margin-top: 12px; display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; font: 800 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .athon .am b { color: var(--paper); }
  .athon .rates { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); font: 800 11px/1.6 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .athon .rates b { color: var(--paper); }
  .athon .rates .nw { white-space: nowrap; }

  /* demo boss rush */
  .bossk { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 800 11px/1.3 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .bossk b { color: var(--red); }
  .hp { margin-top: 14px; }
  .hp .hpl { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font: 900 11px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .hp .hpl b { color: var(--paper); font: 700 13px/1 var(--mono); letter-spacing: 0; }
  .hp .bar { height: 22px; box-shadow: inset 0 0 0 2px rgba(244,243,238,.16); }
  .hp .bar i { background: linear-gradient(90deg, #a8140d, var(--red)); }
  .hp.low .bar i { animation: breathe 1.1s ease-in-out infinite; }
  .fs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .fs div { background: var(--ink); padding: 10px 12px 9px; box-shadow: inset 0 0 0 1px rgba(244,243,238,.08); min-width: 0; }
  .fs b { display: block; font: 400 34px/1 var(--display); font-variant-numeric: tabular-nums; }
  .fs small { display: block; margin-top: 4px; font: 900 11px/1 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .fs .f b { color: var(--red); }
  .pips { display: flex; gap: 5px; margin-top: 14px; flex-wrap: wrap; }
  .pips i { width: 20px; height: 6px; background: rgba(244,243,238,.14); }
  .pips i.sign { background: var(--red); } .pips i.develop { background: var(--paper); } .pips i.pass { background: var(--dim2); }
  .pips i.cur { background: var(--paper); animation: breathe 1.4s ease-in-out infinite; }
  .stamp.develop { color: var(--paper); } .stamp.pass { color: var(--dim); }
  .callby { margin-top: 8px; font: 800 12px/1.35 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); overflow-wrap: anywhere; }
  .callby b { color: var(--paper); }
  .mvp { margin-top: 14px; background: var(--gold); color: var(--ink); padding: 12px 14px 13px; }
  .mvp .kick { color: rgba(10,10,10,.7); }
  .mvp .mt { margin-top: 4px; font: 400 30px/1 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
  .mvp .mw { margin-top: 6px; font: 800 12px/1.3 var(--ui); letter-spacing: .12em; text-transform: uppercase; }
  .rres { margin-top: 12px; display: grid; }
  .rres div { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); align-items: baseline; }
  .rres .n { font: 700 12px/1 var(--mono); color: var(--dim); }
  .rres .t { font: 400 19px/1.1 var(--display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rres .k { font: 900 11px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .rres .k.sign { color: var(--red); } .rres .k.pass { color: var(--dim); }
  .stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* desk bucks: this season / all time */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; cursor: pointer; background: var(--ink); color: var(--dim); font: 900 11px/1 var(--ui); letter-spacing: .18em; text-transform: uppercase;
                 padding: 11px 8px 10px; box-shadow: inset 0 0 0 1px rgba(244,243,238,.1); transition: background-color .25s ease, color .25s ease; }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tabs button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .champ { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 10px 12px; background: rgba(242,182,61,.09); box-shadow: inset 0 0 0 1px rgba(242,182,61,.38);
           font: 800 11px/1.35 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .champ svg { flex: none; width: 24px; height: 18px; }
  .champ span { min-width: 0; overflow-wrap: anywhere; }
  .champ b { color: var(--paper); }
  .rl .rb.neg { color: var(--red); }
  .rl li.one .rb.neg { color: var(--red); }

  .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 900 11px/1 var(--ui); letter-spacing: .24em; text-transform: uppercase; color: var(--red); margin: 6px 0 -4px; }
  .sh span { color: var(--dim); letter-spacing: .12em; }
  footer { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--dim); font: 700 12px/1.5 var(--ui); }
  footer .stl { margin-top: 6px; font: 500 11px/1.4 var(--mono); color: var(--dim2); display: flex; align-items: center; gap: 8px; }
  footer .stl i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim2); flex: none; }
  footer .stl.ok i { background: var(--red); animation: breathe 2.4s ease-in-out infinite; }

  body[data-air="ended"] #after { order: -1; }
  body[data-air="ended"] .mast { order: -2; }
  @media (min-width: 720px) {
    .wrap { padding-top: 40px; }
    .q { font-size: 40px; }
  }
</style>
</head>

// ---------------------------------------------------------------- polls
function renderPoll(p) {
  const el = $("poll"), opts = p && Array.isArray(p.opts) ? p.opts : [];
  if (!p || opts.length < 2) return off(el);
  on(el);
  const done = p.state === "done";
  const r = mount(el, `${p.q}|${opts.join("|")}|${done}`, el => {
    const R = { rows: [] }, bd = band("Chat decides", ""); el.append(bd.el); R.timer = bd.r;
    const body = h("div", "body"); el.append(body);
    body.append(h("div", "q", String(p.q || "Chat decides")));
    opts.forEach((o, i) => {
      const bg = h("i"), pv = h("span", "pv", "0%"), row = h("div", "prow", bg, h("span", "pk", "!" + (i + 1)), h("span", "pl", String(o)), pv);
      body.append(row); R.rows.push({ row, bg, pv });
    });
    R.foot = h("div", "foot"); body.append(R.foot);
    return R;
  });
  const tally = opts.map((_, i) => num((p.tally || [])[i])), tot = tally.reduce((a, b) => a + b, 0);
  const win = done && p.result && p.result.i != null ? p.result.i : -1;
  r.rows.forEach((x, i) => { const pc = tot ? tally[i] / tot : 0; x.bg.style.transform = `scaleX(${pc.toFixed(4)})`; setT(x.pv, Math.round(pc * 100) + "%"); x.row.classList.toggle("win", i === win); });
  if (!done) { r.timer.dataset.left = num(p.left); setT(r.timer, mmss(num(p.left) - elapsed())); } else { delete r.timer.dataset.left; setT(r.timer, "Decided"); }
  r.foot.replaceChildren();
  r.foot.append(`${fmtN(tot)} ${tot === 1 ? "vote" : "votes"}`);
  if (!done) r.foot.append(" · type ", ...opts.flatMap((_, i) => [i ? " " : "", h("b", null, "!" + (i + 1))]), " in chat");
}

// ---------------------------------------------------------------- pinned chat, A&R Court
function renderPin(p) {
  const el = $("pin");
  if (!p || !p.text) return off(el);
  on(el);
  mount(el, `${p.name}|${p.text}`, el => {
    el.append(h("div", "pq", "“"), h("div", "pk", h("span", "pb", "Pinned by Max"), h("span", "pw", "@" + handle(p.name))), h("div", "pt", String(p.text)));

}
function renderCourt(c) {
  const el = $("court");
  if (!c || !(c.title || c.user)) return off(el);
  on(el);
  const r = mount(el, `${c.title}|${c.user}`, el => {

  if (num(c.queue)) r.foot.append(` · ${fmtN(c.queue)} waiting`);
  r.foot.append(" · ", h("b", null, "!submit"), " + a link to file yours");
}

// ---------------------------------------------------------------- the artist exchange
const NS = "http://www.w3.org/2000/svg";
function spark(svg, hist, up) {
  const hs = (Array.isArray(hist) ? hist : []).map(num).slice(-40);
  svg.replaceChildren();
  if (hs.length < 2) return;
  const lo = Math.min(...hs), hi = Math.max(...hs), rng = Math.max(.5, hi - lo);
  const pts = hs.map((v, i) => `${(i / (hs.length - 1) * 94 + 1).toFixed(1)},${(34 - (v - lo) / rng * 32).toFixed(1)}`).join(" ");
  const pl = document.createElementNS(NS, "polyline");
  pl.setAttribute("points", pts); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", up ? "#F4F3EE" : "#FF4429");
  pl.setAttribute("stroke-width", "2.5"); pl.setAttribute("stroke-linejoin", "round"); pl.setAttribute("stroke-linecap", "round");
  const last = pts.split(" ").pop().split(","), dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", last[0]); dot.setAttribute("cy", last[1]); dot.setAttribute("r", "3"); dot.setAttribute("fill", up ? "#F4F3EE" : "#FF4429");
  svg.append(pl, dot);
}
function renderStock(x) {
  const el = $("stock"), rows = x && Array.isArray(x.rows) ? x.rows : [];
  if (!rows.length) return off(el);
  on(el);
  const r = mount(el, `${x.state}|${rows.map(z => z.t).join(",")}`, el => {
    const bd = band("Artist Exchange", x.state === "open" ? "Open" : "Closed", x.state === "open" ? "" : "quiet"); el.append(bd.el);
    const body = h("div", "body"); el.append(body);
    const R = { rows: [] };
    for (const z of rows) {
      const sub = h("small"), svg = document.createElementNS(NS, "svg"), price = h("span"), chg = h("small");
      svg.setAttribute("viewBox", "0 0 96 36"); svg.setAttribute("aria-hidden", "true");
      const xp = h("div", "xp", price, chg);
      body.append(h("div", "xrow", h("div", "xt", "$" + String(z.t || "").toUpperCase(), sub), svg, xp));
      R.rows.push({ sub, svg, price, chg, xp });
    }
    body.append(h("div", "foot", x.state === "open" ? h("span", null, "Type ", h("b", null, "!buy ebrl 100"), " · ", h("b", null, "!sell ebrl"), " in chat · live listeners move the price") : "Closed for the night · 100 = the opening bell"));
    return R;
  });
  rows.forEach((z, i) => {
    const R = r.rows[i]; if (!R) return;
    const up = num(z.chg) >= 0;
    setT(R.sub, String(z.name || "") + (z.listeners ? ` · ${fmtN(z.listeners)} listening` : ""));
    roll(R.price, num(z.price), v => v.toFixed(1), 900);
    setT(R.chg, (up ? "▲ +" : "▼ ") + num(z.chg).toFixed(1) + "%");
    R.xp.className = "xp " + (up ? "up" : "dn");
    const sig = JSON.stringify(z.hist || []);
    if (R.svg._sig !== sig) { R.svg._sig = sig; spark(R.svg, z.hist, up); }
  });
}

// ---------------------------------------------------------------- desk bucks: this season (gains this month) / all time (the rich list)
let richTab = null;
try { richTab = localStorage.getItem("mib-live-tab"); } catch (e) { /* private window */ }
const CROWN = () => {
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 24 18"); svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M2 15 L1 4 L7 9 L12 1 L17 9 L23 4 L22 15 Z"); p.setAttribute("fill", "#F2B63D");
  const b = document.createElementNS(NS, "rect"); b.setAttribute("x", "2"); b.setAttribute("y", "15.5"); b.setAttribute("width", "20"); b.setAttribute("height", "2.5"); b.setAttribute("fill", "#F2B63D");
  svg.append(p, b); return svg;
};
const signed = v => (num(v) < 0 ? "−" : "+") + Math.abs(Math.round(num(v))).toLocaleString("en-US");
function renderRich(all, season) {
  const el = $("rich");
  all = Array.isArray(all) ? all.filter(x => x && x.name).slice(0, 10) : [];
  const sz = season && typeof season === "object" ? season : null;
  const srows = sz && Array.isArray(sz.rows) ? sz.rows.filter(x => x && x.name).slice(0, 10) : [];
  if (!all.length && !srows.length) return off(el);
  on(el);
  let tab = richTab === "all" && all.length ? "all" : richTab === "season" && srows.length ? "season" : srows.length ? "season" : "all";
  const rows = tab === "season" ? srows : all, champ = sz && sz.champ && sz.champ.name ? sz.champ : null;
  const r = mount(el, [tab, rows.map(x => x.name).join("|"), sz && sz.label, champ && champ.name, !!srows.length, !!all.length].join("~"), el => {
    const bd = band("Desk Bucks", tab === "season" ? String((sz && sz.label) || "This season") : "The rich list", "paper"); el.append(bd.el);
    const body = h("div", "body"); el.append(body);
    if (srows.length && all.length) {
      const tabs = h("div", "tabs"); tabs.setAttribute("role", "tablist");
      for (const [k, label] of [["season", "This season"], ["all", "All time"]]) {
        const b = h("button", null, label); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(k === tab));
        b.addEventListener("click", () => { richTab = k; try { localStorage.setItem("mib-live-tab", k); } catch (e) { /* fine */ } el._key = null; renderRich((snap || {}).rich, (snap || {}).season); });
        tabs.append(b);
      }
      body.append(tabs);
    }
    if (champ) body.append(h("div", "champ", CROWN(), h("span", null, `${champ.label ? String(champ.label).split("·")[0].trim() + " champion" : "Last season's champion"} `, h("b", null, "@" + handle(champ.name)), num(champ.gain) ? " " + signed(champ.gain) : "")));
    const ol = h("ol", "rl"), R = { b: [] };
    rows.forEach((x, i) => {
      const b = h("span", "rb" + (tab === "season" && num(x.gain) < 0 ? " neg" : ""));
      ol.append(h("li", i === 0 ? "one" : "", h("span", "rk", String(i + 1)), h("span", "rn", "@" + handle(x.name)), b)); R.b.push(b);
    });
    body.append(ol, tab === "season"
      ? h("div", "foot", "This season = Desk Bucks gained this month · the top spot gets crowned · ", h("b", null, "!bucks"))
      : h("div", "foot", "Everyone starts with 1,000 · win bets, trades and the wheel to climb · ", h("b", null, "!bucks")));
    return R;
  });
  rows.forEach((x, i) => tab === "season" ? roll(r.b[i], num(x.gain), signed, 900) : roll(r.b[i], num(x.bucks), v => Math.round(v).toLocaleString("en-US"), 900));
}

// ---------------------------------------------------------------- tonight's receipt
function barcode(seed) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 200 34"); svg.setAttribute("class", "bc"); svg.setAttribute("aria-hidden", "true"); svg.setAttribute("preserveAspectRatio", "none");
  let x = 0, s = Math.abs(Math.round(seed)) + 7;
  while (x < 196) {
    s = (s * 9301 + 49297) % 233280;
    const w = 1 + (s % 4), gap = 1 + ((s >> 3) % 3);
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x); r.setAttribute("y", 0); r.setAttribute("width", w); r.setAttribute("height", 34); r.setAttribute("fill", "#0A0A0A");
    svg.append(r); x += w + gap;
  }
  return svg;
}
function renderReceipt(m) {
  const el = $("receipt"), items = m && Array.isArray(m.receipt) ? m.receipt.map(num).filter(v => v) : [];
  if (!items.length) return off(el);
  on(el);
  const prev = el._n || 0;
  mount(el, `${items.length}|${items.reduce((a, b) => a + b, 0)}`, el => {
    const rc = h("div", "rc");
    const d = new Date(), date = d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    rc.append(h("div", "rh", h("b", null, "The Make It Back Report"), h("span", null, "Tonight's receipt · " + date)), h("hr"));
    const SHOW = 12, start = Math.max(0, items.length - SHOW);
    if (start) rc.append(h("div", "more", `… ${start} earlier ${start === 1 ? "line" : "lines"}`));
    items.slice(start).forEach((v, j) => {
      const i = start + j;
      rc.append(h("div", "li" + (v < 0 ? " neg" : "") + (prev && i >= prev ? " new" : ""), h("span", "n", String(i + 1).padStart(2, "0")),
                  h("span", "d", v < 0 ? "Death tax" : "Made back"), h("span", "a", (v < 0 ? "−" : "+") + money(Math.abs(v)))));
    });
    const tot = num(m.total) || items.reduce((a, b) => a + b, 0);
    rc.append(h("hr"), h("div", "tot", h("span", null, "Total"), h("span", null, money(tot))), barcode(tot * 100 + items.length), h("div", "ty", "Thank you. Make it back."));
    el.append(rc);
  });
  el._n = items.length;
}

// ---------------------------------------------------------------- after the show
function renderAfter(s, air) {
  const el = $("after");
  const p = s.potn, rp = s.report;
  if (!(p && p.label) && !(air === "ended" && rp)) return off(el);
  on(el);
  mount(el, JSON.stringify([p, air === "ended" ? rp : null]), el => {
    if (p && p.label) {
      const card = h("section", "potn");
      card.append(h("div", "kick", "Play of the Night"), h("div", "pl", String(p.label)));
      const who = [p.who ? "@" + handle(p.who) : "", p.clock || ""].filter(Boolean).join(" · ");
      if (who) card.append(h("div", "pw", who));
      el.append(card);
    }
    if (air === "ended" && rp) {
      const box = h("section", "card"), bd = band("Tonight's report", "", "quiet");
      box.append(bd.el);
      const body = h("div", "body"); box.append(body);
      const st = h("div", "stats");
      for (const [k, label] of [["chatters", "Chatters"], ["messages", "Messages"], ["clips", "Clips"], ["bets", "Bets"], ["signed", "Signed"]]) {
        if (rp[k] == null) continue;
        st.append(h("div", null, h("b", null, fmtN(rp[k])), h("small", null, label)));
      }
      const minutes = Math.round(num(s.minutes));
      if (minutes) st.append(h("div", null, h("b", null, fmtN(minutes)), h("small", null, "Minutes")));
      if (rp.top_chatter && rp.top_chatter.user) st.append(h("div", "wide", h("small", null, "Top chatter"), h("b", null, "@" + handle(rp.top_chatter.user)), h("small", null, fmtN(rp.top_chatter.n) + " messages tonight")));
      body.append(st, h("div", "foot", "Same channel, next time · ", h("b", null, "twitch.tv/" + chan())));
      el.append(box);
    }
  });
}

// ---------------------------------------------------------------- one paint
function render() {
  const air = airState(), s = snap || {}, live = air === "live" || air === "standby";
  order = 0;
  renderMast(air, s);
  renderAthon(live ? s.athon : null);
  renderMade(s, air);
  renderRush(live ? s.rush : null);
  renderOffer(live ? s.offer : (air === "ended" && s.offer && s.offer.state === "done" ? s.offer : null));
  renderBet(live ? s.bet : null);
  renderPoll(live ? s.poll : null);
  renderPin(live ? s.pin : null);
  renderCourt(live ? s.court : null);
  renderStock(s.stock);
  renderRich(s.rich, s.season);
  renderReceipt(s.made);
  renderAfter(s, air);
  fitAll();
  status();
  firstPaint = false;
}
// big stamped words (COUNTERED., THAT'S THE SHOW.) shrink until they fit their column
function fitAll() {
  document.querySelectorAll(".stamp, .potn .pl").forEach(el => {
    const par = el.parentElement; if (!par || !el.offsetParent) return;
    const cs = getComputedStyle(par), room = par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 10;
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > room && size > 28) { size -= 4; el.style.fontSize = size + "px"; }
  });
}
function status() {
  const el = $("stl"), now = Date.now();
  let t, ok = false;
  if (fails && (!okAt || now - okAt > 10000)) t = "reconnecting…";
  else if (!okAt) t = "connecting…";
  else if (!snap || !feedOn) t = "waiting for the show";
  else { const a = Math.round(MODE === "public" ? elapsed() : (now - okAt) / 1000); t = a < 3 ? "updated just now" : `updated ${a < 90 ? a + " s" : Math.round(a / 60) + " min"} ago`; ok = a < STALE; }
  el.classList.toggle("ok", ok);
  setT($("stlT"), t);
}
function tick() {
  const e = elapsed();
  document.querySelectorAll("[data-left]").forEach(x => setT(x, mmss(num(x.dataset.left) - e)));
  athonTick();
  status();
}

// ---------------------------------------------------------------- fetch
let busy = false;
async function pull() {
  if (busy) return; busy = true;
  try {
    let s = null, t = Date.now();
    if (MODE === "helper") {
      const r = await fetch("/live/state", { cache: "no-store" });
      if (!r.ok) throw new Error("helper " + r.status);
      s = await r.json();
    } else {
      const r = await fetch(SUPA + "/rest/v1/stream_config?key=eq.live&select=value,updated_at", { cache: "no-store", headers: { apikey: KEY, Authorization: "Bearer " + KEY } });
      if (!r.ok) throw new Error("feed " + r.status);
      const rows = await r.json(), row = Array.isArray(rows) ? rows[0] : null;
      s = row ? row.value : null;
      t = row && row.updated_at ? Date.parse(row.updated_at) || 0 : 0;
    }
    okAt = Date.now(); fails = 0;
    if (s && typeof s === "object" && (s.v || s.at)) { snap = s; feedOn = true; gotAt = t || Date.now(); }
    else feedOn = false;
  } catch (e) { fails++; }
  busy = false;
  render();
}
pull();
setInterval(pull, EVERY);
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fitAll, 120); });
})();
</script>
